---
dev:
  # Enable development mode for the operator.
  # When true: creates a custom CatalogSource, ImageTagMirrorSet, and ImageDigestMirrorSet,
  #   and subscribes to the dev catalog.
  # When false: skips CatalogSource and mirror set creation, and subscribes to redhat-operators instead.
  # Set to false (--set dev.enabled=false) to skip catalog and mirror creation, e.g. in prow CI.
  enabled: true

  # Only used for development purposes, not for production.
  # For production, the official fbc will be used.
  #image: quay.io/beraldoleal/openshift-sandboxed-containers-operator-catalog:1.10-1753889819
  #image: quay.io/redhat-user-workloads/ose-osc-tenant/osc-test-fbc:osc-test-fbc-on-pull-request-h2x69-build-image-index
  image: http://quay.io/redhat-user-workloads/ose-osc-tenant/osc-test-fbc:1.11.0-1763650883

subscription:
  config:
    env: []
